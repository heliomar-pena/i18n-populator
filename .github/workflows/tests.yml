name: Run Tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-20.04

    steps:
      - uses: actions/checkout@v2

      - name: Using Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Dependencies
        run: npm install

      - name: Types Check
        run: npm run type-check

      - name: Run Tests
        run: npm test

      - name: Build
        uses: ./.github/workflows/build.yml
